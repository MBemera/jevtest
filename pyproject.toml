[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-qa"
version = "0.1.0"
description = "AI-driven QA harness for the DT desktop app (Claude Code, Codex and OpenRouter testers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The app process needs DT and PySide6; install DT itself with: pip install -e "../DT[desktop]"
app = ["PySide6==6.8.3"]

[project.scripts]
jev = "jev.cli:main"

[tool.setuptools.packages.find]
include = ["jev*"]

[tool.setuptools.package-data]
jev = ["data/*.md", "data/*.json", "data/missions/*.md", "data/personas/*.md"]
